<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OffTracker - 設定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222;line-height:1.6;margin:0}main{max-width:760px;margin:32px auto;padding:0 18px}header,.panel{background:#fff;border-radius:10px;padding:22px;margin-bottom:16px;box-shadow:0 2px 6px #00000012}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}.muted{color:#666;font-size:14px;margin:0 0 16px}a{color:#2563eb;text-decoration:none}.item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:12px 0;gap:16px}.item-name{font-weight:600}.kind{color:#777;font-size:12px}input{width:20px;height:20px;accent-color:#2563eb}.empty{padding:16px;background:#f8fafc;border-radius:8px;color:#555}.error{color:#b91c1c}
</style></head><body><main>
<header><h1>設定</h1><a href="home.html">ホームへ戻る</a></header>
<section class="panel"><h2>娯楽でも使うアプリ・サービス</h2><p class="muted">娯楽目的で記録したセッションに出てきたものは、自動候補として選択します。候補はいつでも解除できます。娯楽以外の目的で使われた場合も、目的からそれたとは決めつけず、振り返りの手掛かりとして使います。</p><div id="items">読み込み中…</div><p id="error" class="error" role="alert"></p></section>
</main><script>
const itemsNode=document.getElementById('items'),errorNode=document.getElementById('error');
async function load(){try{const observed=await window.__TAURI__.core.invoke('get_observed_leisure_items');if(!observed.length){itemsNode.innerHTML='<div class="empty">まだPC上の行動記録がありません。セッションを記録すると、ここにアプリやサービスが表示されます。</div>';return;}itemsNode.replaceChildren(...observed.map(item=>{const row=document.createElement('label');row.className='item';const name=document.createElement('span');const title=document.createElement('span');title.className='item-name';title.textContent=item.itemName;const kind=document.createElement('span');kind.className='kind';kind.textContent=item.itemType==='service'?'サービス':'アプリ';name.append(title,document.createElement('br'),kind);if(item.autoSuggested){const hint=document.createElement('span');hint.className='kind';hint.textContent='娯楽目的の記録から自動候補';name.append(document.createElement('br'),hint);}const check=document.createElement('input');check.type='checkbox';check.checked=item.registered||item.autoSuggested;check.setAttribute('aria-label',`${item.itemName}を娯楽でも使うものとして登録`);check.addEventListener('change',async()=>{check.disabled=true;errorNode.textContent='';try{await window.__TAURI__.core.invoke('set_leisure_item',{itemType:item.itemType,itemName:item.itemName,enabled:check.checked});}catch(e){check.checked=!check.checked;errorNode.textContent=`保存できませんでした: ${e}`;}finally{check.disabled=false;}});row.append(name,check);return row;}));}catch(e){itemsNode.textContent='設定を読み込めませんでした。';errorNode.textContent=String(e);}}
load();
</script></body></html>
